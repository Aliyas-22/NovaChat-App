version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - novachat_net

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/novachat
      - JWT_SECRET=novachat_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:3000
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - novachat_net

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - novachat_net

volumes:
  mongodb_data:

networks:
  novachat_net:
    driver: bridge