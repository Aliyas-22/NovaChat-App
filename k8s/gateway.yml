# Gateway Class — using Envoy (works everywhere!)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: novachat-gateway-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
# Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: novachat-gateway
  namespace: novachat
spec:
  gatewayClassName: novachat-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

---
# Route for Client (frontend)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: client-route
  namespace: novachat
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: novachat-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: novachat-client-service
          port: 80

---
# Route for Server API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-api-route
  namespace: novachat
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: novachat-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: novachat-server-service
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - group: ""
          kind: Service
          name: novachat-server-service
          port: 5000

---
# Sticky Sessions for Socket.io — VERY IMPORTANT!
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: novachat-session
  namespace: novachat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: server-api-route
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: NOVACHAT_AFFINITY
        ttl: 3600s