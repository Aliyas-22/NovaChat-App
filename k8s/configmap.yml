apiVersion: v1
kind: ConfigMap
metadata:
  name: novachat-config
  namespace: novachat
data:
  # Backend config
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "http://novachat-client-service:3000"

  # MongoDB config
  MONGO_URI: "mongodb://novachat-mongodb-service:27017/novachat"

  # Frontend config
  REACT_APP_API_URL: "/api"
  REACT_APP_SOCKET_URL: "/"