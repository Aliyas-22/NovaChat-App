name: NovaChat GitOps CI - Build & Push to DockerHub

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVER_IMAGE: aliyafirdous22/novachat-server
  CLIENT_IMAGE: aliyafirdous22/novachat-client

jobs:
  build-and-push:
    name: 🚀 Build, Scan & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # STEP 1 - Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2 - Setup Node.js
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # STEP 3 - Test Backend
      - name: Install and test backend
        run: |
          cd server
          npm install
          node --check index.js
          echo "✅ Backend check passed!"

      # STEP 4 - Test Frontend
      - name: Install and build frontend
        run: |
          cd client
          npm install
          CI=false npm run build
          echo "✅ Frontend build passed!"
        env:
          REACT_APP_API_URL: http://localhost:5000/api
          REACT_APP_SOCKET_URL: http://localhost:5000

      # STEP 5 - Secret Scan
      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # STEP 6 - Dependency Scan
      - name: Scan backend dependencies
        run: |
          cd server
          npm audit --audit-level=high || true
          echo "✅ Backend dependency scan done!"

      - name: Scan frontend dependencies
        run: |
          cd client
          npm audit --audit-level=high || true
          echo "✅ Frontend dependency scan done!"

      # STEP 7 - Docker Lint
      - name: Lint Server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile
          failure-threshold: error
        continue-on-error: true

      - name: Lint Client Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: client/Dockerfile
          failure-threshold: error
        continue-on-error: true

      # STEP 8 - Set short image tag
      - name: Set image tag
        id: tag
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Image tag will be: $(git rev-parse --short HEAD)"

      # STEP 9 - Login to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # STEP 10 - Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 11 - Build and Push Server
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # STEP 12 - Build and Push Client
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # STEP 13 - Trivy Image Scan
      - name: Scan Server Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SERVER_IMAGE }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan Client Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.CLIENT_IMAGE }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
        continue-on-error: true

      # STEP 14 - THE GITOPS MAGIC!
      # Update K8s manifests with new image tag
      # ArgoCD will see this and auto deploy!
      - name: Update Kubernetes manifests
        run: |
          git pull origin main --rebase

          # Update server image tag
          sed -i "s|image: ${{ env.SERVER_IMAGE }}:.*|image: ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.sha_short }}|" k8s/server-deployment.yml

          # Update client image tag
          sed -i "s|image: ${{ env.CLIENT_IMAGE }}:.*|image: ${{ env.CLIENT_IMAGE }}:${{ steps.tag.outputs.sha_short }}|" k8s/client-deployment.yml

          echo "✅ K8s manifests updated with tag: ${{ steps.tag.outputs.sha_short }}"

      # STEP 15 - Commit and push manifest
      # ArgoCD watches this → deploys automatically
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/server-deployment.yml
          git add k8s/client-deployment.yml
          git diff --staged --quiet || git commit -m "ci: update novachat images to ${{ steps.tag.outputs.sha_short }} [skip ci]"
          git push origin main

      # STEP 16 - Summary
      - name: Pipeline Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 NovaChat Pipeline Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🖼️  Server: ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.sha_short }}"
          echo "🖼️  Client: ${{ env.CLIENT_IMAGE }}:${{ steps.tag.outputs.sha_short }}"
          echo "📝 K8s manifests updated"
          echo "🔄 ArgoCD will auto deploy shortly!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"