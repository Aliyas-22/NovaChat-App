name: NovaChat CI/CD Pipeline

# When does this pipeline run?
on:
  push:
    branches: [ main ]      # Runs when you push to main branch
  pull_request:
    branches: [ main ]      # Runs when you create a pull request

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — TEST BACKEND
  # ─────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest   # GitHub gives us a fresh Ubuntu machine

    steps:
      # Step 1 — Download your code onto the machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # Step 3 — Install backend dependencies
      - name: Install backend dependencies
        run: |
          cd server
          npm install

      # Step 4 — Check for any syntax errors
      - name: Lint check
        run: |
          cd server
          node --check index.js
          node --check controllers/authController.js
          node --check controllers/messageController.js
          node --check controllers/userController.js
          node --check socket/socketManager.js

  # ─────────────────────────────────────────
  # JOB 2 — TEST FRONTEND
  # ─────────────────────────────────────────
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      # Step — Build React app to check for errors
      - name: Build frontend
        run: |
          cd client
          CI=false npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000/api
          REACT_APP_SOCKET_URL: http://localhost:5000

  # ─────────────────────────────────────────
  # JOB 3 — BUILD AND PUSH DOCKER IMAGES
  # ─────────────────────────────────────────
  build-and-push:
    name: 🐳 Build and Push Docker Images
    runs-on: ubuntu-latest

    # Only runs AFTER both test jobs pass ✅
    needs: [test-backend, test-frontend]

    # Only runs on main branch — not on pull requests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step — Login to Docker Hub using your secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step — Setup Docker Buildx (faster builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step — Build and Push SERVER image
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/novachat-server:latest
            ${{ secrets.DOCKER_USERNAME }}/novachat-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step — Build and Push CLIENT image
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/novachat-client:latest
            ${{ secrets.DOCKER_USERNAME }}/novachat-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step — Print success summary
      - name: Pipeline Summary
        run: |
          echo "🎉 Pipeline completed successfully!"
          echo "📦 Server image: ${{ secrets.DOCKER_USERNAME }}/novachat-server:latest"
          echo "📦 Client image: ${{ secrets.DOCKER_USERNAME }}/novachat-client:latest"
          echo "🔖 Git SHA tag: ${{ github.sha }}"